name: Package Studio trial
run-name: Studio trial ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of locally verified app ZIP
        required: true
        type: string
      manifest_sha:
        description: Existing release manifest Git blob SHA, or missing
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: studio-trial-publication
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      MANIFEST_SHA: ${{ inputs.manifest_sha }}
    steps:
      - name: Validate, sign locally, package and publish trial
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, plistlib, re, shutil, subprocess, tempfile, urllib.request, urllib.parse
          from pathlib import Path
          repo=os.environ['RELEASE_REPOSITORY']; tag=os.environ['RELEASE_TAG']; expected=os.environ['ARCHIVE_SHA256']
          if not re.fullmatch(r'v\d{1,6}\.\d{1,6}\.\d{1,6}',tag) or not re.fullmatch(r'[a-f0-9]{64}',expected):
            raise SystemExit('Invalid release inputs')
          version=tag[1:]; archive=f'Film-one-Studio-{version}-mac-arm64.app.zip'; name=f'Film-one-Studio-{version}-mac-arm64.dmg'
          work=Path(tempfile.mkdtemp(prefix='studio-trial-')); published=False; manifest_saved=False
          def run(*args,env=None):
            return subprocess.run(args,check=True,capture_output=True,text=True,env=env).stdout
          def api(method,endpoint,body=None):
            args=['gh','api',endpoint,'--method',method]
            if body is None: return json.loads(run(*args))
            result=subprocess.run(args+['--input','-'],input=json.dumps(body),capture_output=True,text=True,check=True)
            return json.loads(result.stdout)
          def digest(file):
            value=hashlib.sha256()
            with open(file,'rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''): value.update(block)
            return value.hexdigest()
          def release_manifest():
            if os.environ['MANIFEST_SHA']=='missing': return None, {'schemaVersion':1,'releases':[]}
            file=api('GET',f'repos/{repo}/contents/releases.json')
            if file['sha']!=os.environ['MANIFEST_SHA']: raise RuntimeError('Public manifest changed; retry without overwriting it')
            data=json.loads(base64.b64decode(file['content']))
            if data.get('schemaVersion')!=1 or not isinstance(data.get('releases'),list): raise RuntimeError('Invalid release manifest')
            return file['sha'],data
          clean_env={key:value for key,value in os.environ.items() if key not in ['GH_TOKEN','GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
          try:
            original=api('GET',f'repos/{repo}/releases/tags/{tag}')
            if not original['draft']: raise RuntimeError('Published versions are immutable')
            manifest_sha,manifest=release_manifest()
            old=next((item for item in manifest['releases'] if item.get('platform')=='mac-arm64'),None)
            if old and tuple(map(int,old['version'].split('.')))>=tuple(map(int,version.split('.'))): raise RuntimeError('Version must advance')
            run('gh','release','download',tag,'--repo',repo,'--pattern',archive,'--dir',str(work))
            if digest(work/archive)!=expected: raise RuntimeError('Uploaded ZIP does not match the locally verified app')
            stage=work/'stage'; stage.mkdir(); run('ditto','-x','-k',str(work/archive),str(stage))
            app=stage/'Film-one Studio.app'
            with open(app/'Contents/Info.plist','rb') as file: info=plistlib.load(file)
            if info.get('CFBundleIdentifier')!='com.fileone.studio' or info.get('CFBundleShortVersionString')!=version: raise RuntimeError('App identity/version mismatch')
            run('lipo','-verify_arch','arm64',str(app/'Contents/MacOS'/info['CFBundleExecutable']))
            sign_dir=work/'sign'; run('npm','install','--ignore-scripts','--no-audit','--no-fund','--prefix',str(sign_dir),'@electron/osx-sign@1.3.3',env=clean_env)
            entitlements=work/'entitlements.plist'
            with open(entitlements,'wb') as file: plistlib.dump({'com.apple.security.cs.allow-jit':True},file)
            signing=work/'sign.cjs'
            signing.write_text("const {signAsync}=require("+json.dumps(str(sign_dir/'node_modules/@electron/osx-sign'))+");signAsync({app:"+json.dumps(str(app))+",identity:'-',identityValidation:false,type:'distribution',platform:'darwin',preAutoEntitlements:false,optionsForFile:()=>({entitlements:"+json.dumps(str(entitlements))+",hardenedRuntime:true})}).catch(()=>process.exit(1));")
            run('node',str(signing),env=clean_env)
            run('codesign','--verify','--deep','--strict',str(app))
            descriptor=subprocess.run(['codesign','--display','--verbose=4',str(app)],capture_output=True,text=True,check=True)
            if 'Signature=adhoc' not in descriptor.stderr: raise RuntimeError('Unexpected trial signing identity')
            verifier=api('GET',f'repos/{repo}/contents/scripts/verify-studio-package.mjs')
            scripts=work/'scripts'; scripts.mkdir(); (scripts/'verify-studio-package.mjs').write_bytes(base64.b64decode(verifier['content']))
            (work/'package.json').write_text(json.dumps({'version':version,'dependencies':{'ffmpeg-static':'5.3.0'}}))
            run('node',str(scripts/'verify-studio-package.mjs'),str(app),env=clean_env)
            os.symlink('/Applications',stage/'Applications')
            dmg=work/name
            run('hdiutil','create','-volname','Film-one Studio','-srcfolder',str(stage),'-format','UDZO',str(dmg))
            checksum=digest(dmg); size=dmg.stat().st_size
            if size>=2*1024*1024*1024: raise RuntimeError('DMG exceeds release asset limit')
            mount=work/'mounted'; mount.mkdir(); attached=False
            try:
              run('hdiutil','attach','-readonly','-nobrowse','-mountpoint',str(mount),str(dmg)); attached=True
              run('codesign','--verify','--deep','--strict',str(mount/'Film-one Studio.app'))
              with open(mount/'Film-one Studio.app/Contents/Info.plist','rb') as file: mounted=plistlib.load(file)
              if mounted.get('CFBundleIdentifier')!='com.fileone.studio' or mounted.get('CFBundleShortVersionString')!=version: raise RuntimeError('Final DMG identity/version mismatch')
            finally:
              if attached: run('hdiutil','detach',str(mount))
            run('gh','release','upload',tag,str(dmg),'--repo',repo,'--clobber')
            uploaded=work/'uploaded'; run('gh','release','download',tag,'--repo',repo,'--pattern',name,'--dir',str(uploaded))
            if digest(uploaded/name)!=checksum: raise RuntimeError('Uploaded DMG bytes differ; draft retained')
            notes=work/'notes.md'
            notes.write_text(f'Film-one Studio {version} 免费试用版（Apple 芯片 Mac）。\n\n未经过 Apple Developer ID 签名与公证，macOS 可能阻止打开。更新前退出旧版，再替换应用，保留本机项目与设置。\n\nSHA-256: {checksum}\n\n官网：https://film-one-studio.guangxinshi06.chatgpt.site/\nApple 说明：https://support.apple.com/en-us/102445\n')
            run('gh','release','edit',tag,'--repo',repo,'--notes-file',str(notes),'--prerelease')
            run('gh','release','delete-asset',tag,archive,'--repo',repo,'--yes')
            run('gh','release','edit',tag,'--repo',repo,'--draft=false'); published=True
            release=api('GET',f'repos/{repo}/releases/tags/{tag}')
            url=next(item['browser_download_url'] for item in release['assets'] if item['name']==name)
            parsed=urllib.parse.urlparse(url)
            if parsed.scheme!='https' or parsed.netloc!='github.com' or not parsed.path.startswith('/'+repo+'/releases/download/'): raise RuntimeError('Unexpected public URL')
            class HttpsOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                if urllib.parse.urlparse(newurl).scheme!='https': raise RuntimeError('Redirects must stay on HTTPS')
                return super().redirect_request(req,fp,code,msg,headers,newurl)
            public=hashlib.sha256(); count=0
            with urllib.request.build_opener(HttpsOnly()).open(url,timeout=120) as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):
                count+=len(block)
                if count>size: raise RuntimeError('Public DMG size differs')
                public.update(block)
            if count!=size or public.hexdigest()!=checksum: raise RuntimeError('Public DMG hash differs')
            item={'platform':'mac-arm64','status':'published','channel':'trial','signature':'ad-hoc','notarized':False,'version':version,'url':url,'sha256':checksum,'notes':'免费试用版，尚无 Apple Developer ID 签名与公证；macOS 可能阻止打开。'}
            manifest['releases']=[item]+[old for old in manifest['releases'] if old.get('platform')!='mac-arm64']
            body={'message':f'Publish verified Studio {version} trial download','content':base64.b64encode((json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()).decode(),'branch':'main'}
            if manifest_sha: body['sha']=manifest_sha
            api('PUT',f'repos/{repo}/contents/releases.json',body); manifest_saved=True
            print(json.dumps({'published':True,**item}))
          except Exception:
            if published and not manifest_saved:
              try: run('gh','release','edit',tag,'--repo',repo,'--draft=true')
              except Exception: print('Inspect release visibility manually; public manifest was not updated')
            raise
          finally: shutil.rmtree(work,ignore_errors=True)
          PY
